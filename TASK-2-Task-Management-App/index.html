<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow - Task Management App</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="todo-app">
        <h1>TaskFlow</h1>
        <p class="app-subtitle">Organise your tasks. Stay productive.</p>
        <form class="input-area">
          <input
            type="text"
            name="newTask"
            id="task-input"
            placeholder="Add a new task..."
          />
          <button type="submit" id="add-task-btn">
            <i class="fa-solid fa-plus"></i>
          </button>
        </form>
        <div class="search-area">
          <input
           type="text"
           id="search-input"
           placeholder="Search tasks..."
           >
        </div>
        <div class="todos-container">
          <div class="task-filters">
            <button type="button" class="filter-btn active" data-filter="all">ALL</button>
            <button type="button" class="filter-btn" data-filter="pending">Pending</button>
            <button type="button" class="filter-btn" data-filter="completed">Completed</button>
          </div>
          <ul id="task-list"></ul>
          <img class="empty-image" src="images/no-tasks.png" alt="No tasks found" />
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
